[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ntcip-signal-tamper-guard"
version = "1.0.0"
description = "Edge guard for NTCIP 1202 signal controllers: command policy, runtime invariant monitor, learned behaviour profile, fail-safe."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26", "pandas>=2.2", "scikit-learn>=1.4", "pydantic>=2.6,<3", "pyyaml>=6.0", "matplotlib>=3.8",
                "fastapi>=0.110", "uvicorn[standard]>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
ntcip-guard = "ntcip_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
